name: CI - Java 21 e H2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes automaticos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Executar testes
        run: bash ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Salvar relatorios dos testes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
